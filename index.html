<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King of Tortuga - Build 3A</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topBar"><h1>🏴 King of Tortuga</h1><div id="dayCounter">Dag 1</div></header>
<section id="resources">
<div>🪙 <span id="gold">250</span></div>
<div>🍖 <span id="food">100</span></div>
<div>👥 <span id="crew">30</span></div>
<div>😊 <span id="morale">70</span></div>
<div>☠️ <span id="fear">20</span></div>
<div>⛵ <span id="ship">100</span></div>
<div>🏴 <span id="pirateRep">0</span></div>
<div>🇪🇸 <span id="spanishRep">0</span></div>
</section>
<main id="game">
<section id="characterArea">
<img id="portrait" src="images/characters/placeholder.png" alt="Karakter">
<h2 id="characterName">Styrmand Briggs</h2>
</section>
<section id="storyPanel">
<p id="storyText">Kaptajn... vi har fanget en tyv blandt besætningen. Mændene venter på din afgørelse.</p>
</section>
<section id="buttons">
<button id="yesBtn">JA</button>
<button id="noBtn">NEJ</button>
</section>
<aside id="logbook">
<h3>Logbog</h3>
<ul id="log"><li>Dag 1: Du overtager kommandoen over Tortuga.</li></ul>
</aside>
</main>
<script src="events.js"></script>
<script src="game.js"></script>
</body>
</html>
