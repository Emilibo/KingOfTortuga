<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>King of Tortuga</title>
<style>
body{margin:0;background:#18324a;font-family:Georgia,serif;color:#fff;display:flex;justify-content:center}
#game{max-width:430px;width:100%;background:#5b3b1e;margin:20px;border-radius:16px;overflow:hidden}
header{background:#3d2511;padding:16px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px;background:#6b4724}
.card{background:#7d552d;padding:10px;border-radius:8px;text-align:center}
#portrait{font-size:90px;text-align:center;padding:20px;background:#d7c49a;color:#000}
#text{background:#f0e3bf;color:#000;padding:18px;min-height:180px}
#name{font-size:28px;font-weight:bold;margin-bottom:12px}
.buttons{display:flex;gap:10px;padding:16px;background:#3d2511}
button{flex:1;padding:16px;font-size:22px;border:none;border-radius:10px;color:#fff}
#yes{background:#27ae60}#no{background:#c0392b}
</style>
</head>
<body>
<div id="game">
<header><h1>🏴 King of Tortuga</h1><div id="day"></div></header>
<div class="stats">
<div class="card">💰<br><span id="gold"></span></div>
<div class="card">👥<br><span id="crew"></span></div>
<div class="card">😊<br><span id="morale"></span></div>
<div class="card">🚢<br><span id="ship"></span></div>
</div>
<div id="portrait">🏴‍☠️</div>
<div id="text">
<div id="name"></div>
<div id="dialog"></div>
</div>
<div class="buttons">
<button id="yes">JA</button>
<button id="no">NEJ</button>
</div>
</div>
<script>
let game={day:1,gold:300,crew:40,morale:60,ship:100};
const quests=[
{name:"Styrmand Briggs",text:"Et spansk handelsskib sejler alene. Angribe?",yes:{gold:120,crew:-2},no:{morale:2}},
{name:"Kokken Maria",text:"Købe rom til besætningen?",yes:{gold:-40,morale:8},no:{morale:-6}},
{name:"Kvartérmester Flint",text:"Reparere skibet for 100 guld?",yes:{gold:-100,ship:20},no:{ship:-15}},
{name:"Præsten Gabriel",text:"Skåne de overlevende?",yes:{morale:8},no:{morale:-4}},
{name:"Kahytsdrengen",text:"Må jeg blive en del af besætningen?",yes:{crew:1,morale:2},no:{}}
];
let current=0;
function save(){localStorage.setItem("kot-save",JSON.stringify(game));}
function load(){const s=localStorage.getItem("kot-save");if(s)game=JSON.parse(s);}
function draw(){
day.textContent="Dag "+game.day;
gold.textContent=game.gold;
crew.textContent=game.crew;
morale.textContent=game.morale;
ship.textContent=game.ship;
name.textContent=quests[current].name;
dialog.textContent=quests[current].text;
save();
}
function choose(side){
const r=quests[current][side];
for(const k in r){game[k]=(game[k]||0)+r[k];}
game.day++;
if(game.crew<=0){alert("Besætningen er væk.");localStorage.removeItem("kot-save");location.reload();}
if(game.ship<=0){alert("Skibet er sunket.");localStorage.removeItem("kot-save");location.reload();}
current=Math.floor(Math.random()*quests.length);
draw();
}
yes.onclick=()=>choose("yes");
no.onclick=()=>choose("no");
load();draw();
</script>
</body>
</html>
