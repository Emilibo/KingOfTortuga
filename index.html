<!DOCTYPE html>
<html lang="da">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>King of Tortuga</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="game">

    <!-- TOP BAR -->

    <header id="topBar">

        <div class="resource">
            💰 <span id="gold">250</span>
        </div>

        <div class="resource">
            🍖 <span id="food">100</span>
        </div>

        <div class="resource">
            👥 <span id="crew">30</span>
        </div>

        <div class="resource">
            😊 <span id="morale">70</span>
        </div>

        <div class="resource">
            ☠️ <span id="fear">20</span>
        </div>

        <div class="resource">
            ⛵ <span id="ship">100</span>
        </div>

        <div class="resource">
            🏴‍☠️ <span id="pirateRep">0</span>
        </div>

        <div class="resource">
            🇪🇸 <span id="spanishRep">0</span>
        </div>

        <div id="dayCounter">
            Dag 1
        </div>

    </header>



    <!-- MIDTE -->

    <main id="mainArea">

        <!-- VENSTRE -->

        <aside id="captainPanel">

            <img
                id="characterImage"
                src="images/captain.png"
                alt="Kaptajn">

            <h2 id="characterName">

                Kaptajnen

            </h2>

        </aside>



        <!-- EVENT -->

        <section id="eventPanel">

            <h1>

                King of Tortuga

            </h1>

            <p id="storyText">

                Historien vises her...

            </p>

            <div id="buttons">

                <button id="yesBtn">

                    JA

                </button>

                <button id="noBtn">

                    NEJ

                </button>

            </div>

        </section>



        <!-- LOG -->

        <aside id="logPanel">

            <h2>

                Logbog

            </h2>

            <ul id="log">

            </ul>

        </aside>

    </main>



    <!-- KARAKTERER -->

    <footer id="characterBar">

        <img src="images/briggs.png">

        <img src="images/maria.png">

        <img src="images/flint.png">

        <img src="images/alvarez.png">

        <img src="images/hawkins.png">

    </footer>

</div>



<script src="events.js"></script>

<script src="save.js"></script>

<script src="game.js"></script>

</body>

</html>
